---
# Proprietary drivers the hardware needs (NVIDIA, Broadcom Wi-Fi, ...), the
# way Ubuntu's own installer does it. Needs a network connection; without one
# the installed system still boots on the open drivers and "sudo
# ubuntu-drivers install" can be run later.
dontChroot: false
timeout: 1800
script:
    - command: "ubuntu-drivers install || true"
      timeout: 1800
