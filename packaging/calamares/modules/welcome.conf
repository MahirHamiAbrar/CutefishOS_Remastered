---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true
# WARNING: Calamares documentation indicates that showDonateUrl will be moved to branding in the future. Be prepared for things to break right here.

requirements:
    requiredStorage:    8
    requiredRam:        0.5
    # Calamares counts the check as passed only if the reply has a body;
    # connectivity-check.ubuntu.com answers 204 No Content, so it always failed.
    internetCheckUrl:	https://geoip.ubuntu.com/lookup

    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - root
        - storage
        - ram

# GeoIP is effectively disabled by setting style to "none"
geoip:
    style:  "none"
    url:    "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
