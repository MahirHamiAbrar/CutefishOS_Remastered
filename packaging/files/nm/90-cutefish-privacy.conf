# Cutefish privacy defaults.
[connectivity]
# No periodic "am I online?" requests to connectivity-check.ubuntu.com.
enabled=false

[device]
wifi.scan-rand-mac-address=yes

[connection]
# A random MAC per Wi-Fi network, stable for that network (so captive portals
# and DHCP leases keep working).
wifi.cloned-mac-address=stable
