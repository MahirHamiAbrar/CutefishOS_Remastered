<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Cutefish OS default fonts: Inter for text, JetBrains Mono for code.
     Scripts these fonts don't cover (CJK, Bengali, ...) fall back to Noto. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>
</fontconfig>
